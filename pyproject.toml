[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "pydantic-tensorstore"
dynamic = ["version"]
description = "Pydantic models for TensorStore specifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Talley Lambert", email = "talley.lambert@gmail.com" }]
keywords = ["tensorstore", "pydantic", "validation", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-core>=2.35.0; python_version>='3.14'",
    "numpy>=1.23.2",
    "numpy>=2.1; python_version>='3.13'",
    "numpy>=2.3.2; python_version>='3.14'",
]

[project.urls]
homepage = "https://github.com/tlambert03/pydantic-tensorstore"
repository = "https://github.com/tlambert03/pydantic-tensorstore"
changelog = "https://github.com/tlambert03/pydantic-tensorstore/releases"

[project.optional-dependencies]
tensorstore = [
    "tensorstore>=0.1.68",
    "tensorstore>=0.1.70; python_version>='3.13'",
    "tensorstore>=0.1.79; python_version>='3.14'",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest>=8.0.0; python_version>='3.14'",
    "pytest-cov>=4.0.0",
    "pydantic-tensorstore[tensorstore]",
    # first releases with wheels for each Python; 6.0 cannot build from source on 3.12+
    "pyyaml>=6.0.1",
    "pyyaml>=6.0.2; python_version>='3.13'",
    "pyyaml>=6.0.3; python_version>='3.14'",
]
dev = [
    { include-group = "test" },
    "ipython>=8.37.0",
    "mypy>=1.18.2",
    "pdbpp>=0.11.7; sys_platform != 'win32'",
    "prek>=0.4.3",
    "pyright>=1.1.405",
    "rich>=14.1.0",
    "ruff>=0.13.1",
]

[tool.uv.sources]
pydantic-tensorstore = { workspace = true }

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
fix = true
unsafe-fixes = true

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
pyupgrade = { keep-runtime-typing = true }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "ANN",  # flake8-annotations
]
ignore = [
    "D401",   # First line should be in imperative mood (remove to opt in)
    "ANN401", # allow Any type
]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates annotations at runtime, so imports for these must not be moved
# into `if TYPE_CHECKING:` blocks.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_tensorstore._core.base.TensorStoreModel",
    "pydantic_tensorstore._core.codec.CodecBase",
    "pydantic_tensorstore._core.spec.BaseSpec",
    "pydantic_tensorstore._core.spec.TensorStoreAdapterSpec",
    "pydantic_tensorstore._core.spec.TensorStoreKvStoreAdapterSpec",
    "pydantic_tensorstore._core.spec.ChunkedTensorStoreKvStoreAdapterSpec",
    "pydantic_tensorstore._kvstore.base.BaseKvStore",
    "pydantic_tensorstore._kvstore.base.KvStoreAdapter",
    "pydantic_tensorstore._kvstore.base._CachedKvStoreAdapter",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]
"docs/*.py" = ["D", "A"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false # default is false

# https://docs.pytest.org/
[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--color=yes"]
testpaths = ["tests"]
filterwarnings = ["error"]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
files = "src"
strict = true
disallow_any_generics = false
disallow_subclassing_any = false
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.11"
reportArgumentType = false
enableExperimentalFeatures = true

# https://coverage.readthedocs.io/
[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "raise AssertionError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]

[tool.coverage.run]
source = ["pydantic_tensorstore"]

[tool.check-manifest]
ignore = [
    ".pre-commit-config.yaml",
    ".ruff_cache/**/*",
    "scripts/**/*",
    "tests/**/*",
    "uv.lock",
]

# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[tool.typos.default]
extend-ignore-identifiers-re = ["ser"]

[tool.typos.files]
# vendored verbatim from google/tensorstore; upstream typos are not ours to fix
extend-exclude = ["tests/ts_schema/**"]
